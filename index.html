<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>屍城日誌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="喪屍末日回合制生存遊戲：廣播招募倖存者，分配搜括、巡邏、保安、維修、煮飯、醫療，撐過每一晚。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Special+Elite&display=swap">
<style>
/* Layout: a shelter logbook under sodium streetlight — sticky header with supply tally + hazard band, tabbed views, survivor rows as manila ID tags */
:root{
  --ash:#14110e; --slab:#1e1a15; --slab2:#28221b; --line:#3b3127; --line2:#54463a;
  --bone:#ece3d2; --dust:#a8977e; --sodium:#ffa23a; --sodium2:#ffc27a;
  --blood:#e0503b; --bile:#a6c94e; --steel:#86afcf; --calm:#7fcf9a;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-type:"Special Elite","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(90% 55% at 50% -12%,rgba(255,162,58,.16),transparent 70%) fixed,var(--ash);color:var(--bone);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ash)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,17,14,.94);backdrop-filter:blur(8px)}
header::after{content:"";display:block;height:5px;background:repeating-linear-gradient(-45deg,var(--sodium) 0 10px,#2a1f12 10px 20px);opacity:.85}
.hbar{display:flex;align-items:center;gap:10px 16px;padding-block:10px 8px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.06em;line-height:1;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--f-type);font-size:12px;color:var(--sodium);letter-spacing:.12em;font-weight:400}
.daystamp{font-family:var(--f-type);font-size:13px;color:var(--dust);border:1px dashed var(--line2);padding:2px 8px;border-radius:3px}
.daystamp b{color:var(--sodium2);font-weight:400;font-size:16px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{padding:6px 12px;border-radius:4px;color:var(--dust);font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--sodium);color:#1c1206}
.supply{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.sp{display:flex;align-items:center;gap:5px;background:var(--slab);border:1px solid var(--line);border-radius:4px;padding:2px 8px 2px 6px;font-size:12px;color:var(--dust)}
.sp b{font-family:var(--f-type);font-weight:400;color:var(--bone);font-size:14px;font-variant-numeric:tabular-nums}
.sp.low b{color:var(--blood)}
.sp i{font-style:normal;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#1c1206}

main{padding-block:18px 60px}
h2{font-family:var(--f-disp);font-weight:900;font-size:20px;margin:0;text-wrap:balance;letter-spacing:.03em}
h3{font-family:var(--f-disp);font-weight:700;font-size:16px;margin:0}
.muted{color:var(--dust)}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--dust);text-transform:uppercase}
.type{font-family:var(--f-type)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:5px;background:var(--slab2);border:1px solid var(--line2);font-weight:700;font-size:14px}
.btn:hover{border-color:var(--sodium)}
.btn.pri{background:var(--sodium);color:#1c1206;border-color:var(--sodium)}
.btn.pri:hover{background:var(--sodium2)}
.btn.danger{background:var(--blood);border-color:var(--blood);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

.panel{background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* chapter */
.chap{position:relative;padding:10px 14px;border-radius:8px;background:linear-gradient(120deg,#2b2016,#1b1712 70%);border:1px solid var(--line2)}
.chl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.chap .no{font-family:var(--f-type);color:var(--sodium);font-size:13px;letter-spacing:.1em}
.chap h2{font-size:18px}
.chap .src{font-size:11px;color:var(--dust);border:1px solid var(--line2);border-radius:3px;padding:0 5px}
.chd{flex-basis:100%;font-size:12px;color:var(--dust)}
.chd summary{cursor:pointer;width:max-content}
.chd p{margin:4px 0 0;max-width:62ch}
.goal{display:flex;gap:6px;align-items:center;font-size:13px}
.goal .chk{width:15px;height:15px;border:1.5px solid var(--sodium);border-radius:3px;display:grid;place-items:center;font-size:10px;color:#1c1206;flex:none}
.peek{display:flex;flex-direction:column;gap:8px;background:var(--slab2);border:1px solid var(--sodium);border-radius:6px;padding:10px;margin:8px 0 10px}
.pkst{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pkst div{background:var(--slab);border-radius:4px;padding:3px 0;text-align:center;font-size:10px;color:var(--dust);line-height:1.2}
.pkst b{display:block;font-family:var(--f-type);font-weight:400;font-size:14px;color:var(--bone)}
@media (max-width:420px){.pkst{grid-template-columns:repeat(4,minmax(0,1fr))}}
.goal.done .chk{background:var(--sodium)}

/* forecast */
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc div{background:var(--slab2);border-radius:6px;padding:8px 10px}
.fc b{display:block;font-family:var(--f-type);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.fc span{font-size:11px;color:var(--dust)}
.fc .bad b{color:var(--blood)}.fc .ok b{color:var(--calm)}

/* survivor rows */
.urow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px;border-radius:8px;background:var(--slab);border:1px solid var(--line)}
.urow.off{opacity:.55}
.urow .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.urow .who b{font-size:15px}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.bar{font-size:10px;color:var(--dust);display:flex;flex-direction:column;gap:2px}
.bar s{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden;text-decoration:none}
.bar s i{display:block;height:100%;border-radius:3px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--dust);white-space:nowrap}
.chip.bad{border-color:var(--blood);color:var(--blood)}
.chip.inf{border-color:var(--bile);color:var(--bile)}
.chip.good{border-color:var(--calm);color:var(--calm)}
.chip.warn{border-color:var(--sodium);color:var(--sodium)}
.jobs{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
@media (max-width:560px){.jobs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.jb{padding:5px 2px;border-radius:5px;background:var(--slab2);border:1px solid var(--line);font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.jb em{font-style:normal;font-family:var(--f-type);font-size:13px}
.jb[aria-pressed="true"]{background:var(--sodium);border-color:var(--sodium);color:#1c1206}
.jb[aria-pressed="true"] em{color:#1c1206!important}
.jb:disabled{opacity:.35;cursor:not-allowed}
.gS{color:#ffb8f5}.gA{color:var(--sodium2)}.gB{color:var(--calm)}.gC{color:var(--steel)}.gD{color:var(--dust)}

/* avatar tag */
.av{--c1:#6b6257;--c2:#3c352d;width:46px;height:56px;border-radius:5px 5px 5px 14px;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center;position:relative;font-family:var(--f-disp);font-weight:900;font-size:24px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);flex:none;grid-row:span 2}
.av::before{content:"";position:absolute;top:5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ash);box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.av span{position:absolute;bottom:2px;right:4px;font-family:var(--f-type);font-size:10px;font-weight:400}
.r-UR{--c1:#f2a6e6;--c2:#6c4fc2}.r-SSR{--c1:#f2c552;--c2:#9a6510}.r-SR{--c1:#a77ff0;--c2:#4c2c8f}.r-R{--c1:#6fa0e8;--c2:#25477e}.r-C{--c1:#8d867c;--c2:#47413a}
.av.dead{filter:grayscale(1) brightness(.6)}
.rk{font-family:var(--f-type);font-size:11px;padding:0 5px;border-radius:3px;color:#1c1206}
.rk.UR{background:linear-gradient(90deg,#ffc3f3,#b9e9ff,#fff1b0)}.rk.SSR{background:#f2c552}.rk.SR{background:#b993ff}.rk.R{background:#7eaaf0}.rk.C{background:#a59e93}
.stars{color:var(--sodium);font-size:11px;letter-spacing:1px}

/* settings selects */
.sel{width:100%;background:var(--slab2);color:var(--bone);border:1px solid var(--line2);border-radius:5px;padding:7px 8px;font:inherit}
.field{display:flex;flex-direction:column;gap:4px}

/* facilities */
.fac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fac div{background:var(--slab2);border-radius:5px;padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.fac b{font-family:var(--f-type);font-weight:400;color:var(--sodium2)}
.wall{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.wall i{display:block;height:100%;background:repeating-linear-gradient(90deg,#8b7a63 0 14px,#6e604d 14px 16px)}

/* roster */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tag{position:relative;background:#d9c9a8;color:#2a2117;border-radius:6px 6px 6px 18px;padding:10px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 2px 0 #7b6a4f}
.tag::before{content:"";position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ash)}
.tag .tt{display:flex;gap:8px;align-items:center}
.tag .av{width:40px;height:48px;font-size:20px;grid-row:auto}
.tag b{font-size:14px;line-height:1.2}
.tag small{font-size:11px;color:#6a5a43;display:block}
.tag .chip{border-color:#8b7a5f;color:#5a4a33;background:rgba(255,255,255,.25)}
.tag .chip.bad{border-color:#b33a28;color:#b33a28}.tag .chip.inf{border-color:#5f7e18;color:#5f7e18}
.tag.res{background:#a9a08f;opacity:.85}
.tag.gone{background:#5a534a;color:#ccc;cursor:default}
.tag.gone small{color:#aaa}
.secth{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}

/* radio gacha */
.radio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:720px){.radio{grid-template-columns:minmax(0,1fr)}}
.dial{position:relative;aspect-ratio:1.7;max-width:100%;border-radius:14px;background:linear-gradient(180deg,#3a2f24,#211a13);border:1px solid var(--line2);overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.scale{position:relative;height:46px;border-radius:6px;background:#120e0a;border:1px solid #4d3f30;overflow:hidden}
.scale::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,194,122,.5) 0 1px,transparent 1px 10px);mask:linear-gradient(180deg,#000 0 40%,transparent 40%)}
.scale .nums{position:absolute;inset:auto 0 4px;display:flex;justify-content:space-around;font-family:var(--f-type);font-size:10px;color:var(--sodium2)}
.needle{position:absolute;top:0;bottom:0;width:2px;background:var(--blood);left:30%;box-shadow:0 0 8px var(--blood);transition:left 1.2s cubic-bezier(.3,1.4,.5,1)}
.grill{flex:1;margin-top:12px;border-radius:8px;background:radial-gradient(circle,#0f0b08 1.6px,transparent 2px) 0 0/8px 8px,#2b2219}
.rates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.rate{background:var(--slab2);border-radius:6px;padding:6px;text-align:center}
.rate b{font-family:var(--f-type);font-weight:400;display:block;font-size:14px}
.rate span{font-size:11px;color:var(--dust)}

/* log */
.log{font-family:var(--f-type);font-size:14px;line-height:1.7;background:#e6dbc4;color:#2a2117;border-radius:6px;padding:18px 18px 18px 46px;position:relative;background-image:repeating-linear-gradient(180deg,transparent 0 23px,rgba(80,110,150,.25) 23px 24px);background-color:#e6dbc4}
.log::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1px;background:rgba(200,60,50,.5)}
.log h4{margin:14px 0 2px;font-size:15px;color:#7a2a1c;font-weight:400}
.log h4:first-child{margin-top:0}
.log p{margin:0;max-width:70ch}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.86);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(620px,100%);background:var(--slab);border:1px solid var(--line2);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.modal.paper{background:#e6dbc4;color:#2a2117;border-color:#b9a582}
.modal.paper .muted{color:#6a5a43}
.modal.paper h2{color:#2a2117}
.modal .story{font-family:var(--f-type);font-size:15px;line-height:1.75;white-space:pre-line}
.modal .eyebrow{font-family:var(--f-type);font-size:12px;letter-spacing:.2em;color:var(--sodium)}
.modal.paper .eyebrow{color:#9a3a22}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:6px;border:1px solid #9c8a6a;background:rgba(255,255,255,.35);color:#2a2117;font-weight:700}
.opt small{display:block;font-weight:400;color:#6a5a43;font-size:12px}
.opt:hover:not(:disabled){background:#fff3d6;border-color:#9a3a22}
.opt:disabled{opacity:.45;cursor:not-allowed}
.result{font-family:var(--f-type);background:rgba(154,58,34,.08);border-left:3px solid #9a3a22;padding:10px 12px;white-space:pre-line}
.rep{display:flex;flex-direction:column;gap:4px;font-size:13px}
.rep h4{margin:10px 0 2px;font-family:var(--f-disp);font-size:15px;color:var(--sodium2)}
.rep h4:first-child{margin-top:0}
.rep p{margin:0}
.rep .b{color:var(--blood)}.rep .g{color:var(--calm)}.rep .y{color:var(--bile)}
.night{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--slab2);border-radius:8px;padding:12px;text-align:center}
.night b{font-family:var(--f-type);font-weight:400;font-size:28px;display:block}
.night .vs{font-family:var(--f-disp);color:var(--dust)}

/* pull reveal */
.pullgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:560px){.pullgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc .tt{flex-direction:column;align-items:flex-start;gap:6px}
.pc .tt b{word-break:break-word}
.pullgrid.one{grid-template-columns:minmax(0,220px);justify-content:center}
.pc{perspective:700px}
.pc .in{position:relative;transition:transform .55s;transform-style:preserve-3d}
.pc.open .in{transform:rotateY(180deg)}
.pc .back,.pc .front{backface-visibility:hidden;border-radius:8px}
.pc .back{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#3a2f24 0 8px,#2a2219 8px 16px);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-type);color:var(--sodium);font-size:12px}
.pc .front{transform:rotateY(180deg)}
.pc.g-UR .back{box-shadow:0 0 18px #f2a6e6}.pc.g-SSR .back{box-shadow:0 0 14px #f2c552}
.badge{font-size:10px;font-family:var(--f-type);padding:0 5px;border-radius:3px;background:var(--blood);color:#fff;align-self:flex-start}
.badge.dup{background:#6b5a3e}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--sodium);color:#1c1206;font-weight:700;padding:8px 16px;border-radius:6px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.statgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.statgrid s{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden;text-decoration:none}
.statgrid s i{display:block;height:100%;background:var(--sodium)}
.aptg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center}
.aptg div{background:var(--slab2);border-radius:5px;padding:4px 0;font-size:11px;color:var(--dust)}
.aptg b{display:block;font-family:var(--f-type);font-weight:400;font-size:16px}

/* floor plan */
.plan{display:grid;gap:6px;grid-auto-columns:minmax(0,1fr);grid-auto-rows:minmax(92px,auto);border:6px solid #5b4c3c;border-radius:6px;padding:6px;background:#0d0a08}
.zone{position:relative;border-radius:4px;padding:6px 8px;border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),#2a241d}
.zone:hover{border-color:var(--line2)}
.zone.drop{outline:2px dashed var(--sodium);outline-offset:-3px}
.zone.no{opacity:.35}
.z-scav{background:linear-gradient(transparent calc(50% - 1px),transparent calc(50% - 1px)),repeating-linear-gradient(90deg,rgba(255,194,122,.3) 0 18px,transparent 18px 36px) center/100% 2px no-repeat,#1c1a18;border-style:dashed}
.z-patrol{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px),#181512;border-style:dashed}
.z-guard{border-top:5px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--sodium) 0 8px,#2a1f12 8px 16px) 5 0 0 0 / 5px 0 0 0}
.z-rest{background:repeating-linear-gradient(0deg,rgba(134,175,207,.05) 0 1px,transparent 1px 14px),#25221f}
.z-medic{background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px),#2b2826}
.zh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.zh b{font-family:var(--f-disp);font-size:14px}
.zh span{font-size:11px;color:var(--sodium2)}
.zp{font-size:10px;color:var(--dust);opacity:.75}
.toks{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:auto;padding-top:4px}
.tok{display:flex;flex-direction:column;align-items:center;gap:1px;width:44px}
.tok .d{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:15px;color:#fff;box-shadow:0 0 0 2px var(--ring,transparent),0 2px 4px rgba(0,0,0,.5);position:relative}
.tok small{font-size:10px;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bone)}
.tok.sel .d{box-shadow:0 0 0 2px var(--sodium),0 0 14px var(--sodium)}

const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), rf=(a,b)=>a+R()*(b-a), cl=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(R()*a.length)];
let G=null;
const MULK=['sanDecay','risk','eat','staRec','tough','bite','partsSave','medSave','horde','lootAll','feed','research'];
const FXC={};
function fxOf(u){
  if(FXC[u.id])return FXC[u.id];
  const c=CH[u.id],f={job:{},loot:{}};
  const add=x=>{for(const k in x){
    if(k==='job'||k==='loot'){for(const j in x[k])f[k][j]=(f[k][j]||1)*x[k][j];}
    else if(MULK.includes(k))f[k]=(f[k]??1)*x[k];
    else f[k]=(f[k]||0)+x[k];
  }};
  c.tr.forEach(t=>add(TR[t].fx));add(c.fx);
  MULK.forEach(k=>{if(f[k]===undefined)f[k]=1});
  return FXC[u.id]=f;
}
const nm=u=>CH[u.id].n;
const stat=(u,k)=>{const b=CH[u.id].s[ST.indexOf(k)];return b?Math.min(25,b+u.star):0};
const maxHp=u=>60+stat(u,'str')*2+u.star*4;
const BS=g=>BASES[g.base]||BASES.store;
const bedCap=g=>BS(g).beds+g.fac.beds*2;
const act=g=>g.units.filter(u=>u.act);
const uOf=id=>G.units.find(u=>u.id===id);
const fortMax=g=>BS(g).wall+g.fac.wall*30;
const isS=(u,j)=>j!=='rest'&&canWork({...u,crit:0,iso:0},j)&&grade(apt(u,j)*(fxOf(u).job[j]||1))==='S';
const isAnimal=u=>!!fxOf(u).animal;
const talker=u=>!isAnimal(u);
const NOANIMAL=['repair','cook','medic'];

function apt(u,j){
  if(j==='rest')return 0;
  if(fxOf(u).animal&&NOANIMAL.includes(j))return 0;
  let a=0;for(const k in JOBS[j].w)a+=JOBS[j].w[k]*stat(u,k);return a;
}
function grade(a){return a>=16?'S':a>=13?'A':a>=10?'B':a>=7?'C':'D'}
function canWork(u,j){if(j==='rest')return true;if(u.crit||u.iso)return false;if(fxOf(u).animal&&NOANIMAL.includes(j))return false;return true}
function condMult(u){
  const f=fxOf(u);let m=1;
  if(u.inj)m*=.6; if(u.sick)m*=.7; if(u.hungry)m*=.85;
  if(u.sta<30&&!f.noTired)m*=.7;
  if(u.san<25)m*=.6;else if(u.san>=85)m*=1.15;
  return m;
}
function eff(u,j){
  if(!canWork(u,j)||j==='rest')return 0;
  const f=fxOf(u);let e=apt(u,j)*condMult(u)*(f.job[j]||1);
  if(f.berserk&&j==='guard'&&u.hp<maxHp(u)/2)e*=1.5;
  return e;
}
function groups(g){
  const by={};JK.forEach(j=>by[j]=[]);
  act(g).forEach(u=>{const j=canWork(u,u.job)?u.job:'rest';by[j].push(u)});
  return by;
}
function teamFx(g,k,mode){ // mode: 'sum' | 'mul' | 'max' | 'any'
  const A=act(g);
  if(mode==='sum')return A.reduce((s,u)=>s+(fxOf(u)[k]||0),0);
  if(mode==='mul')return A.reduce((s,u)=>s*(fxOf(u)[k]??1),1);
  if(mode==='max')return A.reduce((s,u)=>Math.max(s,fxOf(u)[k]??1),1);
  return A.some(u=>fxOf(u)[k]);
}
function hordeBase(g){
  const d=g.day;
  return (5+d*1.3+Math.max(0,d-25)*.55)*CHAPS[g.ch-1].hm*(BS(g).horde||1)*teamFx(g,'horde','mul')*g.warn;
}
function raidTonight(g){return g.day===40&&!g.flags.allied&&!g.flags.paid}
function forecast(g){
  const by=groups(g);
  const P=by.patrol.reduce((s,u)=>s+eff(u,'patrol'),0);
  const sP=by.patrol.filter(u=>isS(u,'patrol')).length;
  const red=Math.min(.4+(sP?.15:0),P*.012+sP*.1);
  let horde=hordeBase(g)*(1-red);
  if(raidTonight(g))horde+=38+(g.flags.angry?10:0);
  let ammo=g.res.ammo,gp=0;
  by.guard.forEach(u=>{let e=eff(u,'guard');if(fxOf(u).noAmmo)e*=1.5;else if(ammo>0){ammo--;e*=1.5}gp+=e+(isS(u,'guard')?8:0)});
  const def=g.fort*.4+gp+(BS(g).def||0)+teamFx(g,'def','sum')+act(g).filter(u=>!u.crit).reduce((s,u)=>s+stat(u,'str')*.15,0);
  const A=act(g);
  const eat=A.reduce((s,u)=>s+fxOf(u).eat,0);
  const K=by.cook.reduce((s,u)=>s+eff(u,'cook'),0)*(1+.25*g.fac.kitchen)*by.cook.reduce((s,u)=>Math.max(s,fxOf(u).feed),1);
  const ratio=A.length?cl(K/(A.length*3),0,1):0;
  const sC=by.cook.some(u=>isS(u,'cook'));
  const food=Math.ceil(eat*(1-.35*ratio-(sC?.15:0)));
  return {sC,horde:Math.round(horde),lo:Math.round(horde*.85),hi:Math.round(horde*1.2),def:Math.round(def),food,water:A.length,red,P,ratio,by};
}

/* ---------- 單位操作 ---------- */
function newUnit(id){const u={id,star:0,hp:0,sta:90,san:75,inj:0,crit:0,inf:0,sick:0,iso:0,hungry:0,job:'rest',act:true,joined:G?G.day:1};u.hp=maxHp(u);return u}
function addUnit(g,id){
  // returns {type:'new'|'star'|'max'|'dead', u}
  g.dex[id]=1;
  if(g.gone[id]&&g.gone[id].dead)return{type:'dead'};
  const ex=g.units.find(u=>u.id===id);
  if(ex){if(ex.star>=5)return{type:'max',u:ex};ex.star++;ex.hp=Math.min(maxHp(ex),ex.hp+8);return{type:'star',u:ex}}
  delete g.gone[id];
  const u=newUnit(id);u.joined=g.day;u.act=act(g).length<bedCap(g);g.units.push(u);
  u.job=bestJob(u);
  return{type:'new',u};
}
function bestJob(u){let b='rest',v=0;JK.forEach(j=>{if(j==='rest')return;const a=apt(u,j)*(fxOf(u).job[j]||1);if(a>v){v=a;b=j}});return b}
function hurt(u,d){d=Math.round(d*fxOf(u).tough);u.hp-=d;u.inj=1;if(u.hp<maxHp(u)*.25&&u.hp>0)u.crit=1;return d}
function infect(u,src){
  if(fxOf(u).immune)return `${nm(u)} 被咬咗一啖……但傷口好快就埋口，佢對病毒免疫。`;
  if(u.inf>0)return '';
  u.inf=3;G.queue.push({id:'bitten',c:{u:u.id,src}});
  return `${nm(u)} 被咬咗！`;
}
function killUnit(u,why){
  G.units=G.units.filter(x=>x!==u);
  G.gone[u.id]={d:G.day,why,dead:true};
  act(G).forEach(x=>sanD(x,-8));
  addLog(`${nm(u)} 死咗。${why}`);
}
function leaveUnit(u,why){G.units=G.units.filter(x=>x!==u);G.gone[u.id]={d:G.day,why,dead:false};addLog(`${nm(u)} 離開咗據點。${why}`)}
function sanD(u,n){if(n<0)n*=fxOf(u).sanDecay;u.san=cl(u.san+n,0,100)}
function allSan(n){act(G).forEach(u=>sanD(u,n))}
function addRes(o){const out=[];for(const k in o){if(!o[k])continue;G.res[k]=Math.max(0,(G.res[k]||0)+o[k]);if(k==='core'&&o[k]>0)G.flags.coreTotal=(G.flags.coreTotal||0)+o[k];out.push(`${RES[k].n} ${o[k]>0?'+':''}${o[k]}`)}return out.join('、')}
function bestBy(fn,filter){const A=act(G).filter(u=>!u.crit&&!u.iso&&(!filter||filter(u)));if(!A.length)return null;return A.reduce((a,b)=>fn(b)>fn(a)?b:a)}
function addLog(t){G.log.push({d:G.day,t});if(G.log.length>400)G.log.splice(0,G.log.length-400)}

/* ---------- 結束一日 ---------- */
function endDay(){
  const g=G;if(g.over)return null;
  const A=act(g);const rep=[];const H=t=>rep.push({h:t});const L=(t,c='')=>{rep.push({t,c})};
  const by=groups(g);
  const fc=forecast(g);
  A.forEach(u=>u.worked=canWork(u,u.job)?u.job:'rest');
  H('白天');
  // 搜括
  if(by.scav.length){
    const loc=LOCS.find(l=>l.id===g.loc&&l.ch<=g.ch&&l.id!==g.base)||LOCS.find(l=>l.id!==g.base);
    const sc=by.scav;
    let pw=sc.reduce((s,u)=>s+eff(u,'scav')*fxOf(u).lootAll,0);
    if(sc.length===1&&fxOf(sc[0]).loner)pw*=1.4;
    const sS=sc.some(u=>isS(u,'scav'));if(sS)pw*=1.3;
    const dep=g.dep[loc.id]??1;const got={};
    for(const r in loc.loot){
      if(r==='serum'){if(R()<loc.loot.serum*pw/10)got.serum=1;continue}
      let m=1;sc.forEach(u=>{const lm=fxOf(u).loot[r];if(lm)m=Math.max(m,lm)});
      const n=Math.round(pw/10*loc.loot[r]*LSCALE[r]*dep*rf(.7,1.3)*m);
      if(n>0)got[r]=n;
    }
    if(sS&&!got.serum&&R()<.05)got.serum=1;
    const txt=addRes(got);
    L(`${sc.map(nm).join('、')} 去咗${loc.n}搜括：${txt||'乜都搵唔到'}${dep<.6?'（呢度已經畀人搜得七七八八）':''}`,txt?'g':'');
    g.dep[loc.id]=Math.max(.35,dep*.85);
    const tf=Math.max(.7,1-.07*(sc.length-1));
    sc.forEach(u=>{
      const base=loc.dg*cl(1.45-eff(u,'scav')/20,.4,1.4)*fxOf(u).risk*tf*(isS(u,'scav')?.5:1);
      if(R()<base){const d=hurt(u,ri(12,28));L(`${nm(u)} 喺${loc.n}受傷（-${d} HP）${u.crit?'，傷勢嚴重！':''}`,'b')}
      if(R()<base*.3*fxOf(u).bite){const t=infect(u,loc.n);if(t)L(t,fxOf(u).immune?'':'y')}
    });
    const pc=g.clear[loc.id]||0;g.clear[loc.id]=Math.min(100,pc+pw*.8);
    if(pc<100&&g.clear[loc.id]>=100){addLog(`${loc.n}已經清場。`);if(BASES[loc.id])g.queue.push({id:'cleared',c:{loc:loc.id}})}
    else if(BASES[loc.id])L(`${loc.n}清場進度 ${Math.round(g.clear[loc.id])}%`);
    if(loc.id==='museum'&&!g.flags.codex&&!g.flags.codexQ){g.flags.codexQ=1;g.queue.push({id:'codex'})}
    if(loc.id==='lab'&&!g.flags.labSeen){g.flags.labSeen=1;g.queue.push({id:'labfind'})}
  }
  // 巡邏
  if(by.patrol.length){
    const P=fc.P;
    const got={food:Math.round(P*.1*rf(.3,1.5)),parts:Math.round(P*.07*rf(.3,1.5)),bat:Math.round(P*.6*rf(.6,1.4))};
    L(`${by.patrol.map(nm).join('、')} 巡咗附近幾條街，清走一批遊蕩者（今晚屍潮 -${Math.round(fc.red*100)}%），順手執到 ${addRes(got)||'少少嘢'}`,'g');
    by.patrol.forEach(u=>{if(isS(u,'patrol')&&R()<.25){L(`${nm(u)}【掃蕩】喺一個空單位搵到倖存者留低嘅嘢：${addRes({bat:40})}`,'g')}});
    by.patrol.forEach(u=>{if(R()<.05*fxOf(u).risk){const d=hurt(u,ri(8,18));L(`${nm(u)} 巡邏時被突襲（-${d} HP）`,'b')}});
  }
  // 維修
  if(by.repair.length){
    const W=by.repair.reduce((s,u)=>s+eff(u,'repair')*(isS(u,'repair')?1.3:1),0);
    const ps=by.repair.reduce((s,u)=>Math.min(s,fxOf(u).partsSave),1)*(by.repair.some(u=>isS(u,'repair'))?.7:1);
    let pj=g.proj;if(pj!=='fort'&&g.fac[pj]>=FAC[pj].max)pj=g.proj='fort';
    if(pj==='fort'){
      const room=fortMax(g)-g.fort;
      if(room<=0)L(`${by.repair.map(nm).join('、')} 檢查咗一輪，圍牆完好，冇嘢要修。`);
      else{
        let add=Math.min(room,Math.round(W*2.2));let cost=Math.ceil(add/18*ps);
        if(cost>g.res.parts){add=Math.round(add*g.res.parts/Math.max(1,cost));cost=g.res.parts}
        g.fort+=add;g.res.parts-=cost;
        L(`${by.repair.map(nm).join('、')} 修補圍牆 +${add}（用咗 ${cost} 零件）${add===0?'——冇零件，乜都做唔到':''}`,add?'g':'b');
      }
    }else{
      const lv=g.fac[pj],need=FAC[pj].work(lv);
      g.prog[pj]=Math.min(need,(g.prog[pj]||0)+W);
      if(g.prog[pj]>=need){
        const cost=Math.round(FAC[pj].cost(lv)*ps);
        if(g.res.parts>=cost){g.res.parts-=cost;g.fac[pj]++;g.prog[pj]=0;L(`${FAC[pj].n}升到 ${g.fac[pj]} 級！（用咗 ${cost} 零件）`,'g');addLog(`${FAC[pj].n}升到 ${g.fac[pj]} 級。`);if(pj==='wall')g.fort+=30;if(g.fac[pj]>=FAC[pj].max)g.proj='fort'}
        else L(`${FAC[pj].n}嘅工程做好晒，但仲差零件（要 ${cost}，得 ${g.res.parts}）`,'b');
      }else L(`${by.repair.map(nm).join('、')} 起緊${FAC[pj].n}（${Math.round(g.prog[pj])}/${need}）`);
    }
  }
  // 醫療
  if(by.medic.length){
    let M=by.medic.reduce((s,u)=>s+eff(u,'medic'),0)*(1+.25*g.fac.clinic)*(BS(g).medic||1);
    const sM=by.medic.some(u=>isS(u,'medic'));
    const ms=by.medic.reduce((s,u)=>Math.min(s,fxOf(u).medSave),1);
    const herbal=by.medic.some(u=>fxOf(u).herbal);
    const useMed=()=>{if(g.res.med<=0)return sM||(herbal&&R()<.5);if(ms>=1||R()<ms)g.res.med--;return true};
    const pts=[...A].sort((a,b)=>(b.crit-a.crit)||(b.inj-a.inj)||(a.hp/maxHp(a)-b.hp/maxHp(b)));
    const done=[];
    for(const u of pts){
      if(u.crit&&M>=6){if(useMed()){u.crit=0;M-=6;done.push(`${nm(u)} 脫離危險`)}}
      if(u.inj&&!u.crit&&M>=4){if(useMed()){u.inj=0;M-=4;done.push(`${nm(u)} 傷口處理好`)}}
      if(u.sick&&M>=2){u.sick=0;M-=2;done.push(`${nm(u)} 退咗燒`)}
    }
    // 治感染
    by.medic.forEach(md=>{const c=(fxOf(md).cure||0)+(isS(md,'medic')?.15:0);if(!c)return;A.filter(u=>u.inf>0).forEach(u=>{if(R()<c){u.inf=0;u.iso=0;done.push(`${nm(md)} 救返 ${nm(u)}，感染清除咗！`)}})});
    let heal=Math.round(M*2);const hl=[...A].sort((a,b)=>a.hp/maxHp(a)-b.hp/maxHp(b));
    for(const u of hl){if(heal<=0)break;const n=Math.min(heal,maxHp(u)-u.hp);u.hp+=n;heal-=n}
    L(`${by.medic.map(nm).join('、')} 照顧傷者：${done.length?done.join('；'):'冇乜大傷，幫大家換藥補血'}${g.res.med<=0?'（藥品用晒！）':''}`,g.res.med<=0?'b':'g');
    if(g.ch>=7){
      const rm=teamFx(g,'research','max')*(BS(g).research||1);
      const medOk=g.res.med>0;if(medOk)g.res.med--;
      const add=by.medic.reduce((s,u)=>s+eff(u,'medic'),0)*.7*(g.flags.codex?1:.5)*rm*(medOk?1:.5)*(g.flags.labData?1.25:1);
      g.research=Math.min(100,g.research+add);
      L(`解藥研究 +${add.toFixed(1)}%（而家 ${g.research.toFixed(0)}%）${g.flags.codex?'':'——冇《疫屍錄》，進度減半'}`,'g');
    }
  }
  // 被動
  const pas={water:g.fac.rain*4,food:g.fac.garden*3+teamFx(g,'food','sum'),bat:g.fac.radio*10+teamFx(g,'bat','sum')};
  const bp=BS(g).perk||{};for(const k in bp)pas[k]=(pas[k]||0)+bp[k];
  const pt=addRes(pas);if(pt)L(`${BS(g).n}、設施同專長每日產出：${pt}`);
  const th=teamFx(g,'heal','sum');if(th)A.forEach(u=>u.hp=Math.min(maxHp(u),u.hp+th));
  // 食飯
  H('晚飯');
  const need=fc.food,wneed=fc.water;
  if(!by.cook.length){L('冇人煮飯，大家乾啃罐頭，意志 -3');allSan(-3)}
  else{L(`${by.cook.map(nm).join('、')} 煮咗晚飯（慳咗 ${Math.round(35*fc.ratio)}% 食物）${fc.ratio>=.6?'，大家食得開心，意志 +3':''}`,'g');if(fc.ratio>=.6)allSan(3);if(fc.sC){allSan(3);L('【盛宴】今晚嘅飯餸好似太平年代咁，意志再 +3','g')}}
  A.forEach(u=>u.hungry=0);
  if(g.res.food>=need)g.res.food-=need;
  else{const short=need-g.res.food;g.res.food=0;const n=Math.min(A.length,Math.ceil(short));const v=[...A].sort(()=>R()-.5).slice(0,n);v.forEach(u=>{u.hungry=1;u.hp-=8;sanD(u,-8)});L(`食物唔夠！${v.map(nm).join('、')} 餓肚（-8 HP，意志 -8）`,'b')}
  if(g.res.water>=wneed)g.res.water-=wneed;
  else{const short=wneed-g.res.water;g.res.water=0;const v=[...A].sort(()=>R()-.5).slice(0,short);v.forEach(u=>{u.hp-=10;u.sta=Math.max(0,u.sta-15);sanD(u,-5);if(!fxOf(u).noSick&&R()<.3)u.sick=1});L(`食水唔夠！${v.map(nm).join('、')} 口渴脫水（-10 HP）`,'b')}
  if(!teamFx(g,'noRats','any')&&R()<.1&&g.res.food>5){const n=ri(2,4);g.res.food-=n;L(`老鼠偷咗 ${n} 份食物`,'b')}
  // 夜晚
  H('夜晚');
  const raid=raidTonight(g);
  let horde=Math.round(hordeBase(g)*(1-fc.red)*rf(.85,1.2));
  if(raid)horde+=38+(g.flags.angry?10:0);
  let ammo=g.res.ammo,gp=0;
  by.guard.forEach(u=>{let e=eff(u,'guard');if(fxOf(u).noAmmo)e*=1.5;else if(ammo>0){ammo--;e*=1.5}gp+=e+(isS(u,'guard')?8:0)});
  const used=g.res.ammo-ammo;g.res.ammo=ammo;
  const def=Math.round(g.fort*.4+gp+(BS(g).def||0)+teamFx(g,'def','sum')+A.filter(u=>!u.crit).reduce((s,u)=>s+stat(u,'str')*.15,0));
  const night={horde,def,raid,used};
  if(g.ch>=5)L(pick(['屍群入面有幾隻跑屍，速度快到似人。','一隻兩米高嘅巨屍撞住捲閘。','有隻喪屍不停尖叫，引埋成條街嘅同類過嚟。','啲變異體識得爬牆。']),'y');
  if(raid)L('獵人幫趁住屍潮夜襲，車頭燈照住成個據點！','b');
  if(!by.guard.length)L('今晚冇人守夜……','b');
  if(def>=horde){
    const dmg=Math.round(horde*rf(.05,.15));g.fort=Math.max(0,g.fort-dmg);g.kills+=horde;
    const bat=10+Math.floor(g.day*.8);const extra={bat};
    if(g.ch>=5){const c=(R()<horde/90?1:0)+(horde>=60&&R()<.5?1:0);if(c)extra.core=c}
    L(`守住咗！擊退 ${horde} 隻（${used?`用咗 ${used} 發彈藥，`:''}圍牆 -${dmg}）。天光後喺屍堆搵到 ${addRes(extra)}`,'g');
    night.ok=true;allSan(1);
    if(raid){g.flags.raidWon=1;addRes({ammo:15,med:4,food:10});L('獵人幫丟低車同物資逃走：彈藥 +15、藥品 +4、食物 +10','g');addLog('擊退咗獵人幫嘅夜襲。')}
    by.guard.forEach(u=>{if(R()<.08*horde/Math.max(1,def)){const d=hurt(u,ri(5,12));L(`${nm(u)} 守夜時輕傷（-${d} HP）`,'b')}});
  }else{
    const diff=horde-def;night.ok=false;
    const dmg=Math.round(diff*.8+horde*.08);g.fort=Math.max(0,g.fort-dmg);g.kills+=def;
    L(`防線被衝破！屍潮 ${horde} 對防禦 ${def}，圍牆 -${dmg}`,'b');
    const sG=by.guard.filter(u=>isS(u,'guard'));
    const n=Math.max(0,Math.min(A.length,Math.ceil(diff/15)+(g.fort===0?1:0)-sG.length));
    if(sG.length)L(`${sG.map(nm).join('、')}【一夫當關】頂住咗缺口`,'g');
    const pool=[...A];const vs=[];
    for(let i=0;i<n&&pool.length;i++){const w=pool.map(u=>u.job==='guard'?2:1);let r=R()*w.reduce((a,b)=>a+b,0),k=0;while(r>w[k]){r-=w[k];k++}vs.push(pool.splice(k,1)[0])}
    vs.forEach(u=>{const d=hurt(u,Math.min(45,ri(10,20)+diff*.5));L(`${nm(u)} 喺混戰中受傷（-${d} HP）`,'b');if(!isS(u,'guard')&&R()<(.15+diff/250)*fxOf(u).bite){const t=infect(u,'夜襲');if(t)L(t,'y')}});
    const lost={food:-ri(0,Math.ceil(diff*.2))};if(raid){lost.ammo=-Math.round(g.res.ammo*.3);lost.med=-Math.round(g.res.med*.3);lost.food-=Math.round(g.res.food*.25)}
    const lt=addRes(lost);if(lt)L(`損失：${lt}`,'b');
    allSan(-6);
    if(raid){g.flags.raidLost=1;addLog('獵人幫夜襲得手，搶走咗大批物資。')}
  }
  // 狀態
  H('狀態');
  const calm=teamFx(g,'calm','any');
  const teamSan=teamFx(g,'teamSan','sum');
  [...A].forEach(u=>{
    const f=fxOf(u),j=u.worked;
    if(j==='rest'){u.sta=cl(u.sta+40*f.staRec,0,100);sanD(u,10);u.hp=Math.min(maxHp(u),u.hp+6);if(u.inj&&R()<.2)u.inj=0}
    else{u.sta=cl(u.sta-JOBS[j].sta,0,100);sanD(u,-JOBS[j].san)}
    if(j!=='guard'){u.sta=cl(u.sta+15*f.staRec,0,100);u.hp=Math.min(maxHp(u),u.hp+2)}
    sanD(u,-(2+g.ch*.3));sanD(u,teamSan);
    if(u.sta<=0)u.hp-=5;
    if(u.inj)u.hp-=2; if(u.crit)u.hp-=8;
    if(u.sick){u.hp-=3;u.sta=Math.max(0,u.sta-10);if(R()<.25)u.sick=0}
    if(u.inf)sanD(u,-4);
    if(calm)u.san=Math.max(u.san,1);
  });
  // 感染倒數
  [...A].forEach(u=>{
    if(!u.inf)return;u.inf--;
    if(u.inf===0){
      if(u.iso){killUnit(u,'喺隔離室入面屍變，大家隔住道門聽住佢抓咗成晚。');L(`${nm(u)} 喺隔離室屍變咗……`,'b')}
      else{
        killUnit(u,'喺據點入面屍變。');L(`${nm(u)} 喺大家瞓緊嘅時候屍變咗！`,'b');
        const others=act(g).sort(()=>R()-.5).slice(0,ri(1,2));
        others.forEach(o=>{const d=hurt(o,ri(10,25));L(`${nm(o)} 被屍變嘅同伴襲擊（-${d} HP）`,'b');if(R()<.3){const t=infect(o,'同伴');if(t)L(t,'y')}});
      }
    }
  });
  // 死亡
  [...act(g)].forEach(u=>{if(u.hp<=0){killUnit(u,u.inf?'傷重不治，佢喺屍變之前斷咗氣。':'傷重不治。');L(`${nm(u)} 傷重不治……`,'b')}});
  // 崩潰
  act(g).forEach(u=>{if(u.san<=0&&!u.bd){u.bd=1;g.queue.push({id:'breakdown',c:{u:u.id}})}});
  if(rep[rep.length-1].h)L('大家都撐住。','g');
  // 新一日
  g.day++;g.warn=1;
  LOCS.forEach(l=>{if(g.dep[l.id]!==undefined)g.dep[l.id]=Math.min(1,g.dep[l.id]+.04)});
  if(!act(g).length){const res=g.units.filter(u=>!u.act).slice(0,bedCap(g));res.forEach(u=>u.act=true);if(res.length)addLog(`據點冇人，後備名單上嘅 ${res.map(nm).join('、')} 收到訊號趕嚟。`)}
  if(!g.units.length){g.over='dead';addLog('最後一個人都倒下咗。');save();return{rep,night}}
  const nc=CHAPS.find(c=>c.day===g.day);
  if(nc&&nc.n>g.ch){g.ch=nc.n;addLog(`第${'一二三四五六七'[nc.n-1]}章「${nc.t}」開始。`)}
  const sd=STORY[g.day];if(sd)g.queue.push({id:sd});

function autoAssign(){
  const A=act(G).filter(u=>!u.crit&&!u.iso);act(G).forEach(u=>u.job='rest');
  const free=new Set(A.filter(u=>u.sta>=25||u.inf));
  const take=j=>{let b=null,v=-1;free.forEach(u=>{const e=eff(u,j);if(e>v&&canWork(u,j)){v=e;b=u}});if(b&&v>0){b.job=j;free.delete(b)}return b};
  const hurtN=act(G).filter(u=>u.inj||u.crit||u.sick||u.hp<maxHp(u)*.7).length;
  const fortLow=G.fort<fortMax(G)*.5;
  if(A.length>=3)take('cook');
  if(hurtN||G.ch>=7)take('medic');
  if(G.ch>=7&&A.length>=6)take('medic');
  take('guard');
  if(fortLow)take('repair');
  take('scav');
  let f=forecast(G);
  while(free.size&&f.def<f.hi){if(!take('guard'))break;f=forecast(G)}

  if(!fortLow&&(G.fort<fortMax(G)*.8||G.proj!=='fort'))take('repair');
  if(free.size)take('patrol');
  [...free].forEach(u=>{u.job=bestJob(u);if(!canWork(u,u.job))u.job='rest'});
  act(G).forEach(u=>{if(u.sta<25&&!u.inf)u.job='rest'});
}

function roll(){let r=R()*100;for(const [g,p] of RATES){if((r-=p)<=0)return g}return 'C'}
function pull(n){
  const cost=n===10?900:100;
  if(G.res.bat<cost){toast('電池唔夠。搜括屋邨、地鐵站，或者撐過夜晚都會有');return}
  G.res.bat-=cost;
  const out=[];
  for(let i=0;i<n;i++){
    let g=roll();G.pity++;
    if(G.pity>=50&&g!=='UR')g='SSR';
    if(n===10&&i===9&&!out.some(o=>['UR','SSR','SR'].includes(CH[o.id].g))&&!['UR','SSR','SR'].includes(g))g='SR';
    if(g==='UR'||g==='SSR')G.pity=0;
    const id=pick(BY_G[g]);const r=addUnit(G,id);
    if(r.type==='dead')addRes({bat:30});if(r.type==='max')addRes({bat:50});
    out.push({id,type:r.type,act:r.u&&r.u.act});
  }
  G.pulls+=n;save();renderHead();
  const lab={new:'NEW',star:'突破 +1★',dead:'已犧牲 · 電池 +30',max:'滿星 · 電池 +50'};
  modal(`<div class="modal" style="width:min(900px,100%)">
    <div class="eyebrow">廣播收到 ${n} 個回應</div>
    <div class="pullgrid ${n===1?'one':''}">${out.map((o,k)=>{const c=CH[o.id];return `<div class="pc g-${c.g}" data-k="${k}"><div class="in"><div class="back">· · ·</div><div class="front"><div class="tag" style="cursor:default;height:100%"><div class="tt">${av(o.id)}<div style="min-width:0"><b>${esc(c.n)}</b><small>${esc(c.job)}</small></div></div><span class="badge ${o.type==='new'?'':'dup'}">${lab[o.type]}</span>${o.type==='new'&&!o.act?'<small>床位滿，入咗後備</small>':''}</div></div></div></div>`}).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="again">再廣播 ${n} 次（${n===10?900:100} 電池）</button><button class="btn pri" id="ok">收到</button></div>
  </div>`,()=>{
    const cards=[...document.querySelectorAll('.pc')];const t=cards.map((c,i)=>setTimeout(()=>c.classList.add('open'),250+i*180));
    $('#ok').onclick=()=>{t.forEach(clearTimeout);closeOv()};
    $('#again').onclick=()=>{t.forEach(clearTimeout);closeOv();pull(n)};
  });
}
function rRadio(){
  const total=CH_RAW.length,got=Object.keys(G.dex).length;
  $('#main').innerHTML=`
  <div class="radio">
    <div class="dial"><div class="scale"><div class="nums"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div><div class="needle" id="needle"></div></div><div class="grill"></div></div>
    <div class="stack">
      <h2>緊急廣播</h2>
      <p class="muted" style="margin:0;max-width:52ch">用電池向全城廣播你嘅位置。每個回應嘅人都有自己嘅專長——醫生、廚師、工程師、軍人，甚至一隻狗。床位唔夠嘅會入後備名單，唔使食糧。</p>
      <div class="row"><button class="btn" id="p1">廣播 1 次 · 100 電池</button><button class="btn pri" id="p10">廣播 10 次 · 900 電池</button></div>
      <p class="muted" style="margin:0;font-size:12px">10 連保證至少一個 SR 或以上 · 連續 50 次冇 SSR 必出 SSR（而家 ${G.pity}/50）· 重複角色會突破 +1★（全能力 +1）</p>
      <div class="rates">${RATES.map(([g,p])=>`<div class="rate"><b><span class="rk ${g}">${g}</span></b><span>${p}%</span></div>`).join('')}</div>
    </div>
  </div>
  <div class="secth"><h2>倖存者圖鑑</h2><span class="muted type">${got}/${total}</span></div>
  <div class="cards">${CH_RAW.map(r=>{const id=r[0],c=CH[id],k=G.dex[id];return k?`<div class="tag" style="cursor:default"><div class="tt">${av(id,G.gone[id]&&G.gone[id].dead?'dead':'')}<div><b>${esc(c.n)}</b><small>${esc(c.o)} · ${esc(c.job)}</small></div></div><small>${esc(c.sk.n)}：${esc(c.sk.d)}</small></div>`:`<div class="tag res" style="cursor:default"><div class="tt"><div class="av r-${c.g}">？<span>${c.g}</span></div><div><b>？？？</b><small>未遇見</small></div></div></div>`}).join('')}</div>`;
  $('#p1').onclick=()=>{spin();setTimeout(()=>pull(1),500)};
  $('#p10').onclick=()=>{spin();setTimeout(()=>pull(10),500)};
}
function spin(){const n=$('#needle');if(n)n.style.left=ri(8,90)+'%'}

/* ---------- 日誌 ---------- */
function rLog(){
  const by={};G.log.forEach(l=>{(by[l.d]=by[l.d]||[]).push(l.t)});
  const days=Object.keys(by).map(Number).sort((a,b)=>b-a);
  $('#main').innerHTML=`<div class="secth"><h2>據點日誌</h2><span class="muted">最新喺最上</span></div><div class="log">${days.map(d=>`<h4>第 ${d} 日</h4>${by[d].map(t=>`<p>${esc(t)}</p>`).join('')}`).join('')||'<p>未有紀錄。</p>'}</div>`;
}

/* ---------- 設定 ---------- */
function rMenu(){
  let armed=false;
  $('#main').innerHTML=`<div class="stack" style="max-width:640px">
    <div class="panel stack"><h3>點玩</h3>
      <p style="margin:0">每日幫每個倖存者揀一份工作。卡上嘅字母代表佢做呢份工嘅適合程度（S 最好，D 最差），數值、狀態同專長都會影響。</p>
      <p style="margin:0" class="muted">搜括帶返物資但有機會受傷被咬；巡邏減少今晚屍潮；保安守夜；維修修圍牆同起設施；煮飯慳食物兼提升意志；醫療醫傷者。疲勞、受傷、恐慌都會令效率下降。被咬嘅人三日內會屍變。</p>
      <p style="margin:0" class="muted">跟住七章劇情行：完成解藥研究或者撐到第 ${ENDDAY} 日就係結局。</p>
    </div>
    <div class="panel stack"><h3>兌換碼</h3><div class="row"><input class="sel" id="code" style="flex:1;min-width:0" placeholder="輸入兌換碼" autocomplete="off"><button class="btn" id="redeem">兌換</button></div><span class="muted" id="cmsg"></span></div>
    <div class="panel stack"><h3>重新開始</h3><p class="muted" style="margin:0">清走而家嘅進度，由第 1 日再嚟。</p><div><button class="btn" id="reset">開新一局</button></div></div>
  </div>`;
  $('#redeem').onclick=()=>{const c=$('#code').value.trim().toUpperCase();let m='代碼無效';
    if(c==='BRAINS'&&!G.flags.c1){G.flags.c1=1;addRes({bat:1000});m='電池 +1000'}
    else if(c==='ZOMIBEE'&&!G.flags.c2){G.flags.c2=1;addRes({food:20,water:20,med:10,parts:20,ammo:20});m='物資大禮包已到'}
    else if(['BRAINS','ZOMIBEE'].includes(c))m='呢個代碼已經用過';
    save();renderHead();$('#cmsg').textContent=m};
  $('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='再撳一次確認';e.target.classList.add('danger');return}fresh();save();go('base');showQueue()};
}

/* ================= 啟動 ================= */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
G=load();
if(G){if(!G.base)G.base='mall';if(!G.clear)G.clear={};}else{fresh();save()}
render();
if(G.queue.length)showQueue();

/* ---------- 平面圖 ---------- */
function planHTML(){
  const b=BS(G),A=act(G),loc=LOCS.find(l=>l.id===G.loc);
  const sel=SEL&&uOf(SEL);
  const fr=G.fort/fortMax(G);
  const mv=canMove(G);
  const zones=JK.map(k=>{
    const z=b.z[k];const us=A.filter(u=>(canWork(u,u.job)?u.job:'rest')===k);
    const cls=sel?(canWork(sel,k)?'drop':'no'):'';
    return `<div class="zone z-${k} ${cls}" style="grid-area:${k}" data-z="${k}" role="button" tabindex="0" aria-label="${esc(z[0])}（${z[1]}）">
      <div class="zh"><b>${esc(z[0])}</b><span>${z[1]}${k==='scav'&&loc?' → '+esc(loc.n):''}</span></div>
      ${z[2]?`<div class="zp">${esc(z[2])}</div>`:''}
      <div class="toks">${us.map(tok).join('')||(k==='scav'||k==='patrol'?'':'<span class="zp">（冇人）</span>')}</div>
    </div>`}).join('');
  return `<section class="panel planwrap" style="margin-top:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="min-width:0"><h2>${esc(b.n)}</h2><div class="muted" style="font-size:12px">${esc(b.pd)}</div></div>
      <button class="btn sm" id="move">${mv.length?`搬據點（${mv.length} 個已清場）`:'搬據點'}</button>
    </div>
    ${sel?peek(sel):'<p class="muted" style="margin:6px 0 10px;font-size:12px">撳一個人睇佢嘅狀態；再撳一個區域就可以派佢去做嗰份工。</p>'}
    <div class="plan" style="grid-template-areas:${b.areas.map(r=>`'${r}'`).join(' ')};border-color:${fr<.3?'var(--blood)':fr<.6?'#8a6a3c':'#5b4c3c'}">${zones}</div>
  </section>`;
}
function tok(u){
  const c=CH[u.id],j=canWork(u,u.job)?u.job:'rest';
  const ring=u.inf?'var(--bile)':u.crit||u.inj?'var(--blood)':u.sta<30?'var(--sodium)':'transparent';
  return `<button class="tok r-${c.g} ${SEL===u.id?'sel':''}" data-tok="${u.id}" title="${esc(c.n)} · ${esc(c.job)}"><span class="d" style="--ring:${ring}">${esc(c.av)}${isS(u,j)?'<i>S</i>':''}</span><small>${esc(c.n.split(' ')[0])}</small></button>`;
}
function bindPlan(){
  document.querySelectorAll('[data-tok]').forEach(b=>b.onclick=e=>{e.stopPropagation();SEL=SEL===b.dataset.tok?null:b.dataset.tok;render()});
  document.querySelectorAll('.zone').forEach(z=>{
    const go=()=>{if(!SEL)return;const u=uOf(SEL),k=z.dataset.z;if(!u){SEL=null;return render()}
      if(!canWork(u,k)){toast(u.crit?`${nm(u)} 重傷，只可以休息`:u.iso?`${nm(u)} 隔離緊`:`${nm(u)} 做唔到${JOBS[k].n}`);return}
      u.job=k;SEL=null;save();render()};
    z.onclick=go;z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
  $('#move').onclick=openMove;
  const pm=$('#pkmore');if(pm)pm.onclick=()=>{const id=SEL;SEL=null;openUnit(id)};
}
function openMove(){
  const mv=canMove(G);let armed=null;
  const all=Object.keys(BASES).filter(k=>!BASES[k].start&&k!==G.base);
  modal(`<div class="modal">
    <div class="eyebrow">搬據點</div><h2>而家：${esc(BS(G).n)}</h2>
    <p class="muted" style="margin:0">床位 ${bedCap(G)}、圍牆上限 ${fortMax(G)}。搬走會留低約四分一食物、水同零件，所有設施各跌 1 級。去搜括一個地點就會累積清場進度。</p>
    <div class="stack" style="gap:8px">${all.map(k=>{const b=BASES[k],l=LOCS.find(x=>x.id===k),ok=mv.includes(k),cp=Math.round(G.clear[k]||0),lock=l.ch>G.ch;
      return `<div class="panel row" style="background:var(--slab2);justify-content:space-between">
        <div style="min-width:0;flex:1"><b>${lock?'？？？':esc(b.n)}</b> <span class="muted" style="font-size:12px">${lock?`第${'一二三四五六七'[l.ch-1]}章解鎖`:`${b.beds} 床 · 圍牆 ${b.wall}`}</span>
        ${lock?'':`<div class="muted" style="font-size:12px">${esc(b.d)} ${esc(b.pd)}</div>`}</div>
        ${ok?`<button class="btn pri sm" data-mv="${k}">搬過去</button>`:lock?'':`<span class="type muted" style="font-size:12px">清場 ${cp}%</span>`}
      </div>`}).join('')}</div>
    <button class="btn" id="cx">關閉</button>
  </div>`,()=>{
    $('#cx').onclick=closeOv;
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
      if(armed!==b.dataset.mv){armed=b.dataset.mv;b.textContent='再撳一次確認';b.classList.add('danger');return}
      const out=relocate(b.dataset.mv);save();
      modal(`<div class="modal paper"><div class="eyebrow">搬遷</div><div class="result">${esc(out)}</div><button class="btn pri" id="nx">繼續</button></div>`,()=>{$('#nx').onclick=closeOv});
    });
  });
}

function peek(u){
  const c=CH[u.id],j=canWork(u,u.job)?u.job:'rest';
  return `<div class="peek">
    <div class="row" style="gap:10px;align-items:flex-start;flex-wrap:nowrap">
      ${av(u.id)}
      <div style="min-width:0;flex:1">
        <div class="who row" style="gap:6px"><b>${esc(c.n)}</b>${stars(u.star)}<span class="muted" style="font-size:12px">${esc(c.job)} · 而家：${JOBS[j].n}${isS(u,j)?`【${SPERK[j].n}】`:''}</span></div>
        <div class="chips" style="margin:3px 0">${statusChips(u)||'<span class="chip good">狀態正常</span>'}</div>
        <div class="bars">${bar('HP',u.hp,maxHp(u),u.hp<maxHp(u)*.35?'var(--blood)':'var(--calm)')}${bar('體力',u.sta,100,'var(--sodium)')}${bar('意志',u.san,100,'var(--steel)')}</div>
      </div>
      <button class="btn sm" id="pkmore">詳細</button>
    </div>
    <div class="pkst">${ST.map(k=>`<div><span>${STN[k]}</span><b>${stat(u,k)}</b></div>`).join('')}</div>
    <div class="pkst">${JK.filter(x=>x!=='rest').map(x=>{const g=canWork({...u,crit:0,iso:0},x)?grade(apt(u,x)*(fxOf(u).job[x]||1)):'—';return `<div><span>${JOBS[x].n}</span><b class="g${g}">${g}</b></div>`}).join('')}</div>
    <div class="muted" style="font-size:12px">專長【${esc(c.sk.n)}】${esc(c.sk.d)} · 撳區域派佢去，或者再撳頭像取消。</div>
  </div>`;
}
</script>
